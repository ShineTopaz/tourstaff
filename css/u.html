<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  /* 전체 래퍼: iPhone 목업 PNG를 배경으로 사용 */
  .phone {
    position: relative;
    width: 360px;               /* 원하는 크기 */
    aspect-ratio: 1170 / 2532;  /* 목업 원본 비율(예: iPhone 14 Pro) */
    background: url("phone-mock.png") center/cover no-repeat; /* 목업 이미지 */
    margin: 40px auto;
  }

  /* 실제 화면(스크롤 되는 영역) */
  .screen {
    position: absolute;
    left: 28px;     /* 목업에서 화면이 시작되는 x좌표 */
    top: 110px;     /* 목업에서 화면이 시작되는 y좌표 */
    width: 304px;   /* 화면 너비 */
    height: 660px;  /* 화면 높이 */
    overflow: auto; /* 이 안만 스크롤 */
    border-radius: 28px;              /* 모서리 둥글게 */
    -webkit-mask-image: -webkit-radial-gradient(white, black); /* iOS 사파리 경계 부드럽게 */
    background: #fff; /* 필요 시 바탕 */
  }

  /* 스크롤 콘텐츠(긴 이미지나 실제 DOM) */
  .content-img {
    display:block;
    width:100%;
    height:auto;
  }

  /* 필요하면 스크롤바 숨기기(옵션) */
  .screen::-webkit-scrollbar { width: 0; height: 0; }
  .screen { scrollbar-width: none; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <!-- 긴 스크린샷/채팅이미지 or 실제 DOM -->
    <img class="content-img" src="chat-long.png" alt="스크롤되는 화면">
  </div>
</div>

</body>
</html>
